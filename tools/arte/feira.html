  menu: [[2200, ['vai', BX + 100, BY0 + BDY + 12]], [3000, ['vai', BX + 104, BY0 + 2 * BDY + 12]], [3700, ['vai', BX + 98, BY0 + 3 * BDY + 12]], [4500, ['vai', BX + 96, BY0 + 12]], [5600, ['aperta']], [5800, ['solta']]],
  prep: [[900, ['vai', PX[0] + 15, SHELF_Y + 26]], [2100, ['vai', PX[1] + 15, SHELF_Y + 26]], [3100, ['vai', PX[2] + 15, SHELF_Y + 26]], [4100, ['vai', PX[0] + 15, SHELF_Y + 26]], [4800, ['aperta']], [4950, ['solta']],
    [5700, ['vai', 192, 248]], [6900, ['vai', 240, 228]], [8000, ['aperta']], [8150, ['vai', VIT.cols[1], VIT.lin[3] - 8]], [9300, ['solta']], [9900, ['vai', VIT.cols[2], VIT.lin[2] - 10]],
    [11300, ['vai', 430, 256]], [12600, ['aperta']], [12750, ['solta']]],
};
let fila = [];
function iniciaRoteiro(nome) { fila = ROTEIRO[nome].map(([ms, a]) => ({ em: st.t + ms, a })); }
function passoRoteiro() {
  while (fila.length && st.t >= fila[0].em) { const { a } = fila.shift(); if (a[0] === 'vai') { st.cur.dest = { x: a[1], y: a[2], t0: st.t, x0: st.cur.x, y0: st.cur.y }; st.cur.visivel = true; } else if (a[0] === 'aperta') aperta(); else if (a[0] === 'solta') solta(); }
  const d = st.cur.dest; if (d) { const k = ease((st.t - d.t0) / (prep.arrasto ? 900 : 550)); mexe(Math.round(d.x0 + (d.x - d.x0) * k), Math.round(d.y0 + (d.y - d.y0) * k)); if (k >= 1) st.cur.dest = null; }
}

// ================================================================== laço
function entra(cena) {
  st.cena = cena; st.foco = null; st.cur.dest = null;
  if (cena === 'menu') { menu.t0 = st.t; SOM.musica('menu'); setTimeout(() => SOM.toca('carimbo'), 1000); [0, 1, 2, 3].forEach(i => setTimeout(() => SOM.toca('foco'), 1300 + i * 140)); if (AUTO) iniciaRoteiro('menu'); else st.cur.visivel = false; }
  if (cena === 'prep') { prep.t0 = st.t; SOM.musica('prep'); st.cur.x = 300; st.cur.y = 240; if (AUTO) iniciaRoteiro('prep'); }
}
let ultimo = performance.now();
function laco(now) {
  const dt = Math.min(0.05, (now - ultimo) / 1000); ultimo = now; st.t += dt * 1000; const t = st.t;
  if (tela.width !== W * Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)))) ajusta();
  if (AUTO) passoRoteiro();
  passoPart(dt);
  prep.ouroMostra += (prep.ouro - prep.ouroMostra) * Math.min(1, dt * 6);
  if (st.cena === 'menu') cenaMenu(t, dt); else if (st.cena === 'prep') cenaPrep(t, dt); else if (st.cena === 'pecas') cenaPecas(t); else { R(0, 0, W, H, INK); }
  pintaPart();
  if (st.cur.visivel && st.cena !== 'pecas') cursor(st.cur.x, st.cur.y, st.cur.aperta);
  // transições
  const tr = st.trans; if (tr && t >= tr.t0) { const k = (t - tr.t0) / 500; cortina(Math.min(1, ease(k))); if (k >= 1 && !tr.trocou) { tr.trocou = true; tr.t1 = t; if (tr.para === 'fim') { window.__fim = true; st.cena = 'fim'; } else { entra(tr.para); SOM.toca('rasgo'); } } if (tr.trocou) { const k2 = (t - tr.t1) / 500; if (tr.para !== 'fim') { cortina(1 - ease(k2)); if (k2 >= 1) st.trans = null; } } }
  const ent = (t - (st.entrada || 0)) / 700; if (ent < 1) escurece(1 - ent);
  tg.drawImage(buf, 0, 0, W * esc, H * esc);
  requestAnimationFrame(laco);
}
(async () => {
  const ff = new FontFace('m5x7', 'url(../../assets/fonts/m5x7.ttf)'); await ff.load(); document.fonts.add(ff); UI.calibra();
  await UI.carregaSprites(SPRITES);
  montaMenu(); montaPrep(); criaPassantes();
  st.entrada = st.t; entra(st.cena);
  window.__congelar = (ms) => { st.t = ms; };
  window.__pronto = true;
  requestAnimationFrame(laco);
})();
