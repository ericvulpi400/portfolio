<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pacotes e Cartas</title>
<style>
  :root { --bg: #241c30; --bg2: #2e2440; --txt: #f0e6d8; --sub: #b8a8c8; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.4 system-ui, sans-serif; }
  body { padding: 24px; }
  h2 { margin: 8px 0 12px; font-size: 15px; color: var(--sub); font-weight: 600; letter-spacing: .04em; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; margin-bottom: 28px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .item span { color: var(--sub); font-size: 12px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .palco { background: radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg)); border-radius: 8px; padding: 16px 20px; }
</style>
</head>
<body>
<div class="palco">
  <h2>PACOTES (30×50, ampliado 6×)</h2>
  <div class="row" id="pacotes"></div>
  <h2>CARTAS (moldura 36×50 em 2×, ampliado 3× = escala 6×)</h2>
  <div class="row" id="cartas"></div>
</div>
<script src="arte.js"></script>
<script>
'use strict';
const { RP, INK, ARCO_IRIS, Pix, pacote, moldura, escudo, arco, coroa } = window.ARTE;
// ------------------------------------------------------------------ montagem da página (com animações)
const S = 6;
function canvasDe(w, h, escala) { const c = document.createElement('canvas'); c.width = w; c.height = h; c.style.width = w * escala + 'px'; c.style.height = h * escala + 'px'; return c; }
function item(cont, nome, w, h, escala, desenhar) {
  const div = document.createElement('div'); div.className = 'item';
  const c = canvasDe(w, h, escala); const ctx = c.getContext('2d');
  div.append(c); const s = document.createElement('span'); s.textContent = nome; div.append(s); cont.append(div);
  return (t) => { ctx.clearRect(0, 0, w, h); desenhar(ctx, t); };
}
// brilho que varre: troca pixels de uma faixa diagonal pela cor mais clara da rampa (sem transparência)
function varrer(ctx, w, h, t, periodo, claro) {
  if (window.__semBrilho) return;
  const pos = ((t % periodo) / periodo) * (w + h * 1.6) - h;
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4; if (!d[i + 3]) continue;
    const u = x + y * 0.6 - pos; if (u < 0 || u > 2.2) continue;
    if (d[i] + d[i + 1] + d[i + 2] < 120) continue; // não pinta contorno
    const c = claro; d[i] = parseInt(c.slice(1, 3), 16); d[i + 1] = parseInt(c.slice(3, 5), 16); d[i + 2] = parseInt(c.slice(5, 7), 16);
  }
  ctx.putImageData(img, 0, 0);
}
const pac = document.getElementById('pacotes'), car = document.getElementById('cartas');
const loops = [];
const PAC = [['Feira', pacote('verde', escudo), RP.verde[5]], ['Povo', pacote('azul', arco), RP.azul[5]], ['Colecionador', pacote('roxo', coroa, true), RP.ouro[5]]];
PAC.forEach(([n, P, claro], i) => loops.push(item(pac, n, 30, 50, S, (ctx, t) => { P.draw(ctx); varrer(ctx, 30, 50, t + i * 700, 2600, claro); })));
const MOLD = [
  ['Comum', moldura('pedra'), null],
  ['Rara', moldura('azulm', { gema: 'safira' }), RP.azulm[5]],
  ['Épica', moldura('roxo', { gema: 'ametista', cantos: 'ametista' }), RP.roxo[5]],
  ['Lendária', moldura('ouro', { gema: 'rubi', cantos: 'rubi' }), RP.ouro[5]],
  ['Prisma', moldura('pedra', { gema: 'safira', cantos: 'ametista' }), null, true],
  ['Verso', moldura('roxo', { verso: true }), RP.ouro[5]],
];
MOLD.forEach(([n, P, claro, prisma], i) => loops.push(item(car, n, 36, 50, S, (ctx, t) => {
  P.draw(ctx);
  if (prisma) { // moldura holográfica: cicla as cores do arco-íris pela borda
    const img = ctx.getImageData(0, 0, 36, 50), d = img.data;
    for (let y = 0; y < 50; y++) for (let x = 0; x < 36; x++) {
      const i2 = (y * 36 + x) * 4; if (!d[i2 + 3]) continue;
      const lum = (d[i2] + d[i2 + 1] + d[i2 + 2]) / 3; if (lum < 60 || (x > 3 && x < 32 && y > 3 && y < 32) || (y > 35 && y < 45 && x > 5 && x < 30)) continue;
      const c = ARCO_IRIS[(Math.floor((x - y * 0.5) / 5 + t / 160) % 8 + 8) % 8];
      const k = lum > 170 ? 1 : 0.78;
      d[i2] = parseInt(c.slice(1, 3), 16) * k; d[i2 + 1] = parseInt(c.slice(3, 5), 16) * k; d[i2 + 2] = parseInt(c.slice(5, 7), 16) * k;
    }
    ctx.putImageData(img, 0, 0);
  } else if (claro) varrer(ctx, 36, 50, t + i * 500, 3000, claro);
})));
let T0 = performance.now();
window.__congelar = null;
function loop(now) { const t = window.__congelar ?? (now - T0); loops.forEach(f => f(t)); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
