<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abertura de Pacote</title>
<style>
  html, body { margin: 0; height: 100%; background: #120c18; overflow: hidden; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; position: absolute; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<script src="arte.js"></script>
<script>
'use strict';
// Protótipo visual da abertura de pacote (480x270 lógicos, escala inteira). Clique/Espaço avança; ?auto=1 roda sozinho.
const { RP, INK, ARCO_IRIS, Pix, pacote, moldura, escudo } = window.ARTE;
const W = 480, H = 270, Q = new URLSearchParams(location.search), AUTO = Q.get('auto') === '1';
const tela = document.getElementById('tela'), tg = tela.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const g = buf.getContext('2d'); g.imageSmoothingEnabled = false;
let esc = 1;
function ajusta() { esc = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H))); tela.width = W * esc; tela.height = H * esc; tela.style.left = ((innerWidth - W * esc) >> 1) + 'px'; tela.style.top = ((innerHeight - H * esc) >> 1) + 'px'; tg.imageSmoothingEnabled = false; }
addEventListener('resize', ajusta); ajusta();

// ------------------------------------------------------------------ utilidades
let semente = 11; const rnd = () => { semente = (semente * 1664525 + 1013904223) >>> 0; return semente / 4294967296; };
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function pontilha(x, y, w, h, c, t) { g.fillStyle = c; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (BAYER[(y + j) & 3][(x + i) & 3] < t * 16) g.fillRect(x + i, y + j, 1, 1); }
const ease = (t) => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
function pixCanvas(P) { const c = document.createElement('canvas'); c.width = P.w; c.height = P.h; P.draw(c.getContext('2d')); return c; }

// texto pixel: m5x7 a 16 px, binarizado (sem antisserrilhado)
const tcv = document.createElement('canvas'), tcx = tcv.getContext('2d', { willReadFrequently: true }); const TC = new Map(); let TOPO = 5;
function textoImg(s, cor, px) { const k = s + cor + px; if (TC.has(k)) return TC.get(k); tcx.font = `${px}px m5x7`; const w = Math.ceil(tcx.measureText(s).width) + 2; tcv.width = w; tcv.height = px + 8; tcx.font = `${px}px m5x7`; tcx.textBaseline = 'top'; tcx.fillStyle = '#000'; tcx.fillText(s, 0, 0);
  const d = tcx.getImageData(0, 0, w, px + 8); const [r, gg, b] = [1, 3, 5].map(i => parseInt(cor.slice(i, i + 2), 16)); for (let i = 0; i < d.data.length; i += 4) { const a = d.data[i + 3] > 110 ? 255 : 0; d.data[i] = r; d.data[i + 1] = gg; d.data[i + 2] = b; d.data[i + 3] = a; }
  const c = document.createElement('canvas'); c.width = w; c.height = px + 8; c.getContext('2d').putImageData(d, 0, 0); TC.set(k, c); return c; }
function texto(s, x, y, cor, sombra = INK, alinha = 'centro', px = 16) { s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); const t = textoImg(s, cor, px); const w = t.width - 2; if (alinha === 'centro') x -= w >> 1; const yy = y - (px === 32 ? TOPO * 2 : TOPO);
  if (sombra) { const o = textoImg(s, sombra, px); for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1]]) g.drawImage(o, Math.round(x + a), Math.round(yy + b)); } g.drawImage(t, Math.round(x), Math.round(yy)); }

// ------------------------------------------------------------------ sprites MiniFolks
let M = null; const IMG = {};
async function carregar() {
  M = await (await fetch('../../assets/minifolks/manifest.json')).json();
  const ff = new FontFace('m5x7', 'url(../../assets/fonts/m5x7.ttf)'); await ff.load(); document.fonts.add(ff);
  tcv.width = 40; tcv.height = 40; tcx.font = '16px m5x7'; tcx.textBaseline = 'top'; tcx.fillText('H', 2, 2); const d = tcx.getImageData(0, 0, 40, 40).data; let top = 99; for (let y = 0; y < 40; y++) for (let x = 0; x < 40; x++) if (d[(y * 40 + x) * 4 + 3] > 110) top = Math.min(top, y); TOPO = top - 2;
  for (const c of CARTAS) { const s = sp(c.sprite); const v = Object.keys(s.files.pngs).find(v => /outline/i.test(v) && !/without/i.test(v)); s._src = '../../assets/minifolks/' + s.files.pngs[v]; await new Promise(r => { const i = new Image(); i.onload = () => { IMG[s._src] = i; r(); }; i.src = s._src; }); }
}
const sp = (ref) => { const [p, k] = ref.split('/'); return M.packs[p].characters[k]; };
function quadro(ref, anim, t) { const s = sp(ref), A = s.anims[anim] || s.anims.idle, ms = A.ms || Array(A.frames).fill(130); const tot = ms.reduce((a, b) => a + b, 0); let tt = t % tot; for (let i = 0; i < ms.length; i++) { if (tt < ms[i]) return i; tt -= ms[i]; } return 0; }

// ------------------------------------------------------------------ o pacote e as cartas sorteadas (fixas para a demonstração)
const CARTAS = [
  { nome: 'Espadachim', sprite: 'humans/sword', rar: 'comum', chance: '63%' },
  { nome: 'Minerador', sprite: 'dwarfs/dwarfminer', rar: 'comum', chance: '63%' },
  { nome: 'Besteiro', sprite: 'humans/crossbow', rar: 'incomum', chance: '28%' },
  { nome: 'Mago', sprite: 'humans/mage', rar: 'rara', chance: '8%' },
  { nome: 'Rei Anão', sprite: 'dwarfs/dwarfking', rar: 'prisma', chance: '0,05%' },
];
const MOLD = { comum: ['pedra', {}], incomum: ['verde', { gema: 'verde' }], rara: ['azulm', { gema: 'safira' }], epica: ['roxo', { gema: 'ametista', cantos: 'ametista' }], lendaria: ['ouro', { gema: 'rubi', cantos: 'rubi' }], prisma: ['pedra', { gema: 'safira', cantos: 'ametista' }] };
const COR = { comum: RP.pedra, incomum: RP.verde, rara: RP.azulm, epica: RP.roxo, lendaria: RP.ouro, prisma: RP.ouro };
const NOME_RAR = { comum: 'COMUM', incomum: 'INCOMUM', rara: 'RARA', epica: 'EPICA', lendaria: 'LENDARIA', prisma: 'PRISMA' };
const molduraCv = {}; for (const [k, [cor, o]] of Object.entries(MOLD)) molduraCv[k] = pixCanvas(moldura(cor, o));
const versoCv = pixCanvas(moldura('roxo', { verso: true }));
const pacoteCv = pixCanvas(pacote('verde', escudo));

// carta 72x100: moldura 2x + MiniFolk 2x + nome
const cartaCv = CARTAS.map(() => { const c = document.createElement('canvas'); c.width = 72; c.height = 100; return c; });
function pintaCarta(i, t) {
  const c = cartaCv[i], x = c.getContext('2d'), k = CARTAS[i]; x.imageSmoothingEnabled = false; x.clearRect(0, 0, 72, 100);
  x.drawImage(molduraCv[k.rar], 0, 0, 72, 100);
  if (k.rar === 'prisma') { // borda holográfica: recolore a moldura com o arco-íris correndo
    const d = x.getImageData(0, 0, 72, 100); for (let y = 0; y < 100; y++) for (let xx = 0; xx < 72; xx++) { const j = (y * 72 + xx) * 4; if (!d.data[j + 3]) continue; const L = (d.data[j] + d.data[j + 1] + d.data[j + 2]) / 3; if (L < 60 || (xx > 6 && xx < 65 && y > 6 && y < 65) || (y > 71 && y < 90 && xx > 11 && xx < 61)) continue; const cc = ARCO_IRIS[(Math.floor((xx - y * 0.5) / 10 + t / 140) % 8 + 8) % 8]; const f = L > 170 ? 1 : 0.78; d.data[j] = parseInt(cc.slice(1, 3), 16) * f; d.data[j + 1] = parseInt(cc.slice(3, 5), 16) * f; d.data[j + 2] = parseInt(cc.slice(5, 7), 16) * f; } x.putImageData(d, 0, 0);
    for (let s = 0; s < 6; s++) { const px = 8 + ((s * 37 + (t / 60 | 0)) % 56), py = 8 + ((s * 53 + (t / 90 | 0)) % 52); x.fillStyle = '#ffffff'; x.fillRect(px, py, 1, 1); if ((t / 200 | 0) % 2 === s % 2) { x.fillRect(px - 1, py, 3, 1); x.fillRect(px, py - 1, 1, 3); } }
  }
  const s = sp(k.sprite), A = s.anims.idle, f = quadro(k.sprite, 'idle', t);
  x.save(); x.beginPath(); x.rect(6, 6, 60, 58); x.clip();
  x.fillStyle = RP.janela[3]; x.fillRect(16, 58, 40, 3); x.fillRect(20, 61, 32, 1); // sombra no chão da janela
  x.drawImage(IMG[s._src], f * s.cell.w, A.row * s.cell.h, s.cell.w, s.cell.h, 36 - s.pivot.x * 2, 62 - s.pivot.y * 2, s.cell.w * 2, s.cell.h * 2); x.restore();
  const n = k.nome.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); let ti = textoImg(n, '#3a2a1e', 16);
  if (ti.width - 2 > 52) { // nome longo: letras 1 px mais juntas
    const cs = [...n].map(ch => textoImg(ch, '#3a2a1e', 16)); const adv = cs.map(c => c.width - 3); const tot = adv.reduce((a, b) => a + b, 0);
    let xx = 36 - (tot >> 1); cs.forEach((c, k2) => { x.drawImage(c, xx, 79 - TOPO); xx += adv[k2]; });
  } else x.drawImage(ti, 36 - ((ti.width - 2) >> 1), 79 - TOPO);
}

// ------------------------------------------------------------------ partículas
const PART = [];
function estoura(x, y, n, cores, vel = 60, vida = 0.7, sobe = 30) { for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, v = vel * (0.3 + rnd() * 0.7); PART.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sobe, v: vida * (0.6 + rnd() * 0.6), m: 0, c: cores[(rnd() * cores.length) | 0], s: rnd() < 0.3 ? 2 : 1 }); } }
function confete(n) { for (let i = 0; i < n; i++) PART.push({ x: rnd() * W, y: -10 - rnd() * 60, vx: (rnd() - 0.5) * 30, vy: 20 + rnd() * 40, v: 3 + rnd() * 2, m: 0, c: ARCO_IRIS[(rnd() * 8) | 0], s: 2, conf: true }); }
function passoPart(dt) { for (let i = PART.length - 1; i >= 0; i--) { const p = PART[i]; p.m += dt; if (p.m > p.v) { PART.splice(i, 1); continue; } p.vy += (p.conf ? 10 : 120) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.conf) p.vx += Math.sin(p.m * 6 + i) * 2; } }
function pintaPart() { for (const p of PART) { R(p.x, p.y, p.s, p.conf && ((p.m * 8 | 0) % 2) ? 1 : p.s, p.c); } }

// ------------------------------------------------------------------ cena
const XS = [36, 120, 204, 288, 372], YC = 86;
const st = { fase: 'fechado', t: 0, rasgo: -1, virada: 0, vir: [-1, -1, -1, -1, -1], sai: [], flash: 0, tremor: 0, fim: -1, escurece: 0 };
function avancar() {
  if (st.fase === 'fechado') { st.fase = 'rasgando'; st.rasgo = st.t; st.flash = 0.25; estoura(W / 2, 84, 50, [RP.prata[4], RP.prata[3], RP.verde[4], '#ffffff'], 120, 0.8, 40); return; }
  if (st.fase === 'leque') { const i = st.virada; if (i >= 5) return; if (i === 4 && st.suspense < 0) { st.suspense = st.t; return; } st.vir[i] = st.t; st.virada++; return; }
}
st.suspense = -1;
addEventListener('pointerdown', avancar); addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') avancar(); });

function fundo(t) {
  // céu noturno da feira: faixas + estrelas + toldo e luzes
  const faixas = [RP.janela[0], RP.janela[1], RP.janela[2], RP.janela[3]];
  for (let i = 0; i < 4; i++) R(0, i * 50, W, 50, faixas[i]); R(0, 200, W, 70, RP.janela[4]);
  for (let i = 1; i < 4; i++) pontilha(0, i * 50 - 3, W, 3, faixas[i], 0.5);
  semente = 3; for (let i = 0; i < 60; i++) { const x = (rnd() * W) | 0, y = (rnd() * 140) | 0; if (((t / 400 + i) | 0) % 5) R(x, y, 1, 1, RP.papel[3]); }
  // raios de luz do centro (aparecem com a revelação)
  // chão: tábuas do balcão
  for (let x = 0; x < W; x += 40) { R(x, 222, 40, 48, RP.madeira[1]); R(x, 222, 40, 1, RP.madeira[3]); R(x + 39, 222, 1, 48, RP.madeira[0]); for (let k = 0; k < 6; k++) R(x + 4 + ((k * 13 + x) % 30), 228 + k * 7, 6, 1, RP.madeira[0]); }
  R(0, 220, W, 2, RP.madeira[4]); R(0, 222, W, 1, RP.madeira[0]);
  // varal de lâmpadas
  for (let x = 6; x < W; x += 2) { const y = 10 + Math.round(Math.sin(x / W * Math.PI) * 8); R(x, y, 2, 1, RP.madeira[2]); }
  for (let i = 0; i < 14; i++) { const x = 18 + i * 34, y = 12 + Math.round(Math.sin(x / W * Math.PI) * 8); const on = ((t / 300 + i) | 0) % 3; R(x - 1, y, 3, 4, INK); R(x, y + 1, 1, 2, on ? RP.ouro[4] : RP.ouro[2]); if (on) { R(x - 2, y + 1, 1, 2, RP.ouro[1]); R(x + 2, y + 1, 1, 2, RP.ouro[1]); } }
}
function brilhoCarta(x, y, rar, t, forca) { // brilho da raridade "vazando" pelo verso antes de virar
  if (rar === 'comum') return; const r = COR[rar]; const pulso = 0.5 + 0.5 * Math.sin(t / 90);
  const anel = Math.round(2 + pulso * 3 * forca);
  for (let k = anel; k >= 1; k--) { const c = rar === 'prisma' ? ARCO_IRIS[((t / 80 | 0) + k) % 8] : k > 2 ? r[2] : r[4]; R(x - k, y - k, 72 + 2 * k, 1, c); R(x - k, y + 99 + k, 72 + 2 * k, 1, c); R(x - k, y - k, 1, 100 + 2 * k, c); R(x + 71 + k, y - k, 1, 100 + 2 * k, c); }
  if (rnd() < 0.3 * forca) estoura(x + rnd() * 72, y + rnd() * 100, 1, rar === 'prisma' ? ARCO_IRIS : [r[4], r[3]], 10, 0.5, 10);
}
function raios(cx, cy, t, cores, n = 16) { for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + t / 3000; const c = cores[i % cores.length]; for (let d = 30; d < 300; d += 3) { if (((d / 3) | 0) % 2) continue; const x = Math.round(cx + Math.cos(a) * d), y = Math.round(cy + Math.sin(a) * d * 0.8); if (x >= 0 && x < W && y >= 0 && y < H) R(x, y, 2, 2, c); } } }

function quadroCena(t, dt) {
  st.t = t; passoPart(dt); st.flash = Math.max(0, st.flash - dt);
  fundo(t);
  const dentroPrisma = st.vir[4] >= 0 && t - st.vir[4] > 300;
  if (dentroPrisma) raios(W / 2, YC + 50, t, ARCO_IRIS);
  // escurece no suspense e na prisma (pontilhado com a cor mais escura)
  const escuro = st.suspense >= 0 ? Math.min(0.6, (t - st.suspense) / 900) : 0;
  if (st.fase === 'fechado' || st.fase === 'rasgando') {
    // pacote 2x no centro: flutua e treme a cada 1,6 s
    const ts = st.fase === 'rasgando' ? t - st.rasgo : 0;
    const bob = Math.round(Math.sin(t / 400) * 2), treme = st.fase === 'fechado' && (t % 1600) < 180 ? Math.round(Math.sin(t / 18) * 2) : 0;
    const px = W / 2 - 30 + treme, py = 34 + bob + Math.round(ease(ts / 500) * 120);
    R(px + 8, 214, 44, 3, RP.madeira[0]);
    if (st.fase === 'fechado') g.drawImage(pacoteCv, px, py, 60, 100);
    else {
      // tira de cima voa; corpo desce
      g.drawImage(pacoteCv, 0, 7, 30, 43, px, py + 14, 60, 86);
      const tx = px - Math.round(ts * 0.15), ty = py - Math.round(ts * 0.18) + Math.round(ts * ts * 0.0004);
      g.drawImage(pacoteCv, 0, 0, 30, 7, tx, ty, 60, 14);
    }
    if (st.fase === 'fechado') { texto('PACOTE DA FEIRA', W / 2, 150, RP.ouro[4]); texto('clique para abrir', W / 2, 166, RP.papel[2]); }
    if (st.fase === 'rasgando' && ts > 350) { st.fase = 'saindo'; st.saida = t; }
  }
  if (st.fase === 'saindo' || st.fase === 'leque') {
    const ts = t - (st.saida || 0);
    for (let i = 0; i < 5; i++) {
      const k = ease((ts - i * 90) / 450); const x = Math.round(W / 2 - 36 + (XS[i] - (W / 2 - 36)) * k), y = Math.round(150 + (YC - 150) * k);
      const virada = st.vir[i] >= 0 ? t - st.vir[i] : -1;
      if (virada < 0) { if (st.fase === 'leque') brilhoCarta(x, y, CARTAS[i].rar, t, i === 4 && st.suspense >= 0 ? 1 + Math.min(1, (t - st.suspense) / 600) : 1); g.drawImage(versoCv, x, y, 72, 100); }
      else {
        const f = Math.min(1, virada / 260); const w = Math.max(2, Math.round(72 * Math.abs(Math.cos(f * Math.PI))));
        const xx = x + ((72 - w) >> 1), sobe = virada < 260 ? 0 : Math.round(Math.max(0, 1 - (virada - 260) / 300) * 4);
        if (f < 0.5) g.drawImage(versoCv, xx, y, w, 100);
        else { pintaCarta(i, t); g.drawImage(cartaCv[i], xx, y - sobe, w, 100); }
        if (virada >= 130 && !CARTAS[i]._estourou) { CARTAS[i]._estourou = true; const r = CARTAS[i].rar, c = COR[r]; estoura(x + 36, y + 50, 10 + ({ comum: 0, incomum: 6, rara: 16, prisma: 80 }[r] || 0), r === 'prisma' ? [...ARCO_IRIS, '#ffffff'] : [c[4], c[3], '#ffffff'], 60 + (r === 'prisma' ? 120 : 20), 0.8); if (r === 'prisma') { st.flash = 0.4; confete(140); } else if (r === 'rara') st.flash = 0.12; }
        if (virada > 260) { const r = CARTAS[i].rar, c = COR[r]; const rot = r === 'prisma' ? 'PRISMA 0,05%' : NOME_RAR[r] + ' ' + CARTAS[i].chance; const lw = textoImg(rot, '#ffffff', 16).width + 6, lx = x + 36 - (lw >> 1), ly = y + 104;
          R(lx, ly, lw, 12, INK); R(lx + 1, ly + 1, lw - 2, 10, r === 'prisma' ? ARCO_IRIS[(t / 120 | 0) % 8] : c[1]); R(lx + 1, ly + 1, lw - 2, 1, r === 'prisma' ? '#ffffff' : c[3]); texto(rot, x + 36, ly + 3, '#ffffff', INK, 'centro'); }
      }
    }
    if (st.fase === 'saindo' && ts > 900) st.fase = 'leque';
    if (st.fase === 'leque' && st.virada < 5) texto(st.virada === 4 ? (st.suspense >= 0 ? '...' : 'a ultima carta!') : 'clique para virar', W / 2, 236, RP.papel[3]);
    if (st.suspense >= 0 && st.vir[4] < 0 && t - st.suspense > 900) { st.vir[4] = t; st.virada = 5; }
    if (st.vir[4] >= 0 && t - st.vir[4] > 600) {
      texto('JACKPOT!', W / 2, 26, RP.ouro[4], INK, 'centro', 32);
      if (t - st.vir[4] > 1400) { R(W / 2 - 110, 228, 220, 22, INK); R(W / 2 - 109, 229, 218, 20, RP.roxo[1]); texto('ESCADA: 4 raridades  proximo pacote -30%', W / 2, 235, RP.ouro[4], INK); }
    }
  }
  if (escuro > 0 && !(st.vir[4] >= 0)) pontilha(0, 0, W, H, INK, escuro * 0.5);
  pintaPart();
  if (st.flash > 0) pontilha(0, 0, W, H, '#ffffff', Math.min(0.9, st.flash * 3));
  tg.drawImage(buf, 0, 0, W * esc, H * esc);
}

// ------------------------------------------------------------------ laço (passo de tempo controlável para gravação)
let ultimo = performance.now(), T = 0;
window.__tempo = null;
function laco(now) { if (tela.width !== W * Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)))) ajusta(); const dt = Math.min(0.05, (now - ultimo) / 1000); ultimo = now; T += dt * 1000; quadroCena(T, dt); requestAnimationFrame(laco); }
carregar().then(() => {
  requestAnimationFrame(laco);
  if (AUTO) { const passos = [1500, 2700, 3500, 4300, 5100, 5900, 6600]; passos.forEach(ms => setTimeout(avancar, ms)); }
  window.__pronto = true;
});
</script>
</body>
</html>
